name: Build installers

# REWIND cannot be compiled on the Windows development machine: Smart App Control blocks the
# unsigned rustc with os error 4551, and turning it off is irreversible — not a change to make on
# someone's machine to work around a build. So CI is where the Windows installer comes from, which
# is also what ADR 0004 D-30 asks for: a platform that is not built is not supported.
#
# Run it from the Actions tab, or on a tag. The artifacts are downloadable for 30 days.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: rewind-macos
            # The .dmg only. Artifact upload zips without preserving Unix permissions, so a
            # bare .app arrives with its executable bit stripped and genuinely will not run —
            # which macOS reports as "damaged", the same words it uses for a Gatekeeper block.
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: Windows
            artifact: rewind-windows
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # The privacy gates run here too. An installer that skipped them would be the one build where
      # the guarantees did not hold, which is the opposite of what a release should be.
      - name: Privacy gates
        run: |
          pnpm check:forbidden-apis
          pnpm --filter @rewind/protocol test

      # The same signing key the release uses. Updater artifacts cannot be produced without it, and
      # a build workflow that skips the signing step stops being a rehearsal for the release.
      - name: Build
        run: pnpm --filter @rewind/desktop build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 30
