name: Release

# Publishes a signed release that the application updates itself from — so a new version reaches
# both machines without a git pull and a local build on each.
#
# Distribution goes to a SEPARATE PUBLIC repository. This one is private, and GitHub serves a
# private repository's release assets only to an authenticated client. The application has no token
# and must not have one (ADR 0005 D-13: no API connections, nothing to configure), so it could never
# read a manifest published here — the updater would stay silent forever while looking healthy.
# `rewind-dist` therefore holds the built installers and nothing else; the source stays private.
#
# Signing happens only here. The private key never leaves CI, so an update can only come from a
# build that ran in this repository; the application refuses anything that does not verify against
# the public key in tauri.conf.json.
#
# Run it from the Actions tab, or push a v* tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DIST_REPO: jodevweb/rewind-dist

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            platform: darwin-aarch64
            args: '--target aarch64-apple-darwin'
          - os: windows-latest
            label: Windows
            platform: windows-x86_64
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `__VERSION__` is filled from tauri.conf.json, so without this the version typed into the
      # Actions tab is ignored and the run rebuilds whatever version is already committed.
      - name: Set version
        if: inputs.version != ''
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: Read version
        id: version
        shell: bash
        run: node -p "'version='+require('./apps/desktop/package.json').version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # A release that skipped the privacy gates would be the one build where the guarantees did not
      # hold. That is exactly backwards, so they run before anything is published.
      - name: Privacy gates
        run: |
          pnpm check:forbidden-apis
          pnpm --filter @rewind/protocol test

      # No tagName, so tauri-action builds and signs without creating a release here. Publishing is
      # the next job's problem, because it publishes somewhere else.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Collect assets
        run: node scripts/collect-release-assets.mjs ${{ matrix.platform }} ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: release-assets/
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both platforms merge into one directory: two sets of installers and two descriptors.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: assets-*
          merge-multiple: true

      # The checkout is clean, so package.json carries the committed version rather than the one the
      # build jobs stamped. A dispatched version wins over it.
      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/desktop/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the update manifest
        run: node scripts/build-latest-json.mjs "${{ steps.version.outputs.version }}" "$DIST_REPO"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DIST_REPO }}
          # A PAT, because GITHUB_TOKEN is scoped to this repository and cannot write to another.
          token: ${{ secrets.DIST_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: REWIND v${{ steps.version.outputs.version }}
          body: |
            Mise à jour automatique depuis l’application, ou téléchargement ci-dessous.

            Ce dépôt ne contient que les installeurs. Le code source est privé.
          draft: false
          prerelease: false
          files: release-assets/*
