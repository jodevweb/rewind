name: Release

# Publishes a signed release that the application updates itself from — so a new version reaches
# both machines without a git pull and a local build on each.
#
# The release goes HERE, in this repository. That is only possible because it is public: GitHub
# serves a private repository's release assets solely to an authenticated client, and the
# application has no token and must not have one (ADR 0005 D-13). While this repository was private
# the manifest had to live in a second public one, and the updater failed silently against it —
# which is the whole of ADR 0006, now superseded by ADR 0007.
#
# There was a transitional mirror to `rewind-dist`, for copies installed while this repository was
# private and which knew no other endpoint. Both machines have since updated through it, so it is
# gone — along with the second endpoint in tauri.conf.json and the DIST_TOKEN secret (ADR 0008).
#
# Signing happens only here. The private key never leaves CI, so an update can only come from a
# build that ran in this repository; the application refuses anything that does not verify against
# the public key in tauri.conf.json.
#
# Run it from the Actions tab, or push a v* tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            platform: darwin-aarch64
          - os: windows-latest
            label: Windows
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `__VERSION__` is filled from tauri.conf.json, so without this the version typed into the
      # Actions tab is ignored and the run rebuilds whatever version is already committed.
      - name: Set version
        if: inputs.version != ''
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: Read version
        id: version
        shell: bash
        run: node -p "'version='+require('./apps/desktop/package.json').version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # A release that skipped the privacy gates would be the one build where the guarantees did not
      # hold. That is exactly backwards, so they run before anything is published.
      - name: Privacy gates
        run: |
          pnpm check:forbidden-apis
          pnpm --filter @rewind/protocol test

      # The same command build.yml uses, rather than tauri-action. tauri-action picks a package
      # manager from a lockfile in its projectPath, and apps/desktop has none, so it fell back to
      # `npm run tauri` and failed. It was only ever here to create the release, which this workflow
      # no longer asks it to do — the release goes to another repository.
      - name: Build
        run: pnpm --filter @rewind/desktop build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Collect assets
        run: node scripts/collect-release-assets.mjs ${{ matrix.platform }} ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: release-assets/
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # The release lands in this repository, so this job needs to be able to write one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Both platforms merge into one directory: two sets of installers and two descriptors.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: assets-*
          merge-multiple: true

      # The checkout is clean, so package.json carries the committed version rather than the one the
      # build jobs stamped. A dispatched version wins over it.
      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/desktop/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One manifest, pointing at this repository's assets. It is uploaded in two places below,
      # but there is only ever one set of installers and one set of signatures.
      - name: Build the update manifest
        run: node scripts/build-latest-json.mjs "${{ steps.version.outputs.version }}" "${{ github.repository }}"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: REWIND v${{ steps.version.outputs.version }}
          body: |
            Mise à jour automatique depuis l'application, ou téléchargement ci-dessous.

            **Première installation sur macOS.** L'application est signée ad-hoc mais pas notarisée
            par Apple, faute de compte développeur payant. macOS met donc à la corbeille, au
            lancement, toute application téléchargée qu'il ne peut pas vérifier. Après avoir glissé
            REWIND dans Applications, et **avant** de l'ouvrir :

            ```
            xattr -dr com.apple.quarantine /Applications/REWIND.app
            ```

            Une seule fois, par machine. Les mises à jour suivantes passent par l'application et ne
            repassent pas par la quarantaine.
          draft: false
          prerelease: false
          files: release-assets/*
