name: Release

# Publishes a signed release that the application updates itself from.
#
# The release goes in this repository, which must stay public: GitHub serves a private
# repository's release assets only to an authenticated client, and the application has no token
# and must not have one.
#
# Signing happens only here. The private key and its password live in this repository's secrets,
# so an update can only come from a build that ran here; the application refuses anything that does
# not verify against the public key in tauri.conf.json.
#
# Run it from the Actions tab, with the version typed in. There is deliberately no tag trigger: a
# tag push also happens when a tag is moved or restored, and none of those mean "build this". A run
# without a typed version would fall back to the version committed in package.json (0.1.0) and
# publish it as "latest", offering every install a downgrade.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            platform: darwin-aarch64
          - os: windows-latest
            label: Windows
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `__VERSION__` is filled from tauri.conf.json, so without this the version typed into the
      # Actions tab is ignored and the run rebuilds whatever version is already committed.
      # The version reaches the shell through the environment, never pasted into the script: a
      # value typed into the Actions tab is text, and `${{ }}` inside `run:` would make it code.
      # It must also look like a version, so nothing else can be released under that name.
      - name: Set version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $VERSION"; exit 1; }
          node scripts/set-version.mjs "$VERSION"

      - name: Read version
        id: version
        shell: bash
        run: node -p "'version='+require('./apps/desktop/package.json').version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      # A release that skipped the privacy gates would be the one build where the guarantees did not
      # hold. That is exactly backwards, so they run before anything is published.
      - name: Privacy gates
        run: |
          pnpm check:forbidden-apis
          pnpm --filter @rewind/protocol test

      # Not tauri-action: it picks a package manager from a lockfile in its projectPath, and
      # apps/desktop has none, so it falls back to npm and fails.
      - name: Build
        run: pnpm --filter @rewind/desktop build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect assets
        run: node scripts/collect-release-assets.mjs ${{ matrix.platform }} ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.platform }}
          path: release-assets/
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # The release lands in this repository, so this job needs to be able to write one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both platforms merge into one directory: two sets of installers and two descriptors.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets/
          pattern: assets-*
          merge-multiple: true

      # The checkout is clean, so package.json still carries the committed version — `0.1.0`, which it
      # has been since the first commit — rather than the one the build jobs stamped. This used to
      # fall back to it when no version was given, which is how an accidental run published v0.1.0.
      # There is no fallback now: the dispatched version is the only version.
      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One manifest, pointing at this repository's assets, published once. It was uploaded in two
      # places while the mirror existed; there was only ever one set of installers and signatures.
      - name: Build the update manifest
        run: node scripts/build-latest-json.mjs "${{ steps.version.outputs.version }}" "${{ github.repository }}"

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: REWIND v${{ steps.version.outputs.version }}
          body: |
            Mise à jour automatique depuis l'application, ou téléchargement ci-dessous.

            **Première installation sur macOS.** L'application est signée ad-hoc mais pas notarisée
            par Apple, faute de compte développeur payant. macOS met donc à la corbeille, au
            lancement, toute application téléchargée qu'il ne peut pas vérifier. Après avoir glissé
            REWIND dans Applications, et **avant** de l'ouvrir :

            ```
            xattr -dr com.apple.quarantine /Applications/REWIND.app
            ```

            Une seule fois, par machine. Les mises à jour suivantes passent par l'application et ne
            repassent pas par la quarantaine.
          draft: false
          prerelease: false
          files: release-assets/*
