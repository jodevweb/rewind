name: CI

# TypeScript and the privacy gates run on Linux. The Rust daemon is checked on both platforms it
# ships for, on every push: a platform that is not built is not supported. The repository is public,
# so standard runners cost nothing and there is no reason to ration the macOS job.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Golden fixtures are up to date
        run: pnpm --filter @rewind/fixtures build:check
      - name: Test
        run: pnpm test

  privacy-gates:
    name: Privacy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The product promises it never logs keystrokes, reads the clipboard or captures the screen.
      # This makes that promise a build gate rather than a policy statement.
      - name: Forbidden API check (no keylogger, no clipboard, no screen capture)
        run: pnpm check:forbidden-apis

      # A secret that survives redaction blocks the release, whatever else passes.
      - name: Redaction corpus
        run: pnpm --filter @rewind/protocol test

      # Context quality is release-blocking too. The harness validates itself against an oracle
      # baseline, so a broken metric fails here rather than silently reporting good numbers.
      - name: Context engine benchmark
        run: pnpm --filter @rewind/eval test

  rust:
    name: Rust (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
