name: CI

# Minutes are the constraint here, not wall-clock time. This is a private repository on the free
# tier, and GitHub bills runners by a multiplier: Linux x1, Windows x2, macOS x10. A six-minute
# macOS job costs sixty minutes of the monthly allowance, so running one on every push burns the
# month in a few days of ordinary work — which is exactly what happened.
#
# So the shape of this file is deliberate:
#
#   - everything that CAN run on Linux does, and runs there only;
#   - Windows carries the one job that has to prove the Windows build;
#   - macOS runs only when macOS-specific code changed, or on request.
#
# The tradeoff is real: a change to shared Rust code is not proven on macOS until the release
# builds it. That is the right trade at x10 — the release does build both, so nothing ships
# unproven, it is only proven later.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux only. This also ran on Windows at 2x and never once caught something Linux did not:
  # same Node, same pnpm, no platform-specific code in the TypeScript.
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Golden fixtures are up to date
        run: pnpm --filter @rewind/fixtures build:check
      - name: Test
        run: pnpm test

  privacy-gates:
    name: Privacy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # PRIVACY.md §2 promises these APIs are absent from the product. This makes it a build gate
      # rather than a policy statement (ticket P0-008).
      - name: Forbidden API check (no keylogger, no clipboard, no screen capture)
        run: pnpm check:forbidden-apis

      # TESTING.md §11: any failing privacy test blocks the release.
      - name: Redaction corpus
        run: pnpm --filter @rewind/protocol test

      # TESTING.md §11: context quality is release-blocking. The harness validates itself via the
      # oracle baseline, so a broken metric fails here rather than silently reporting good numbers.
      - name: Context engine benchmark
        run: pnpm --filter @rewind/eval test

  # ADR 0004 D-30: both platforms build from the first Rust commit. A platform that is not built
  # is not supported, whatever the documents say — and this is also the only place the Rust code can
  # be compiled at all right now, since Smart App Control blocks an unsigned rustc on the dev machine.
  # Which Rust targets to compile. macOS is gated because of the 10x multiplier: it runs when a
  # macOS provider changed, when the manifest changed, or when someone asks for it.
  decide:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.check.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          if echo "$CHANGED" | grep -qE "(macos|Cargo\.(toml|lock)|tauri\.conf\.json|capabilities/)"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi
          echo "macOS Rust job: ${{ steps.check.outputs.macos }}"

  rust:
    name: Rust (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri needs GTK/webkit on Linux only; macOS and Windows runners already have their webview.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # Same checks, on macOS, only when it can tell us something Windows cannot.
  rust-macos:
    name: Rust (macos)
    needs: decide
    if: needs.decide.outputs.macos == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
