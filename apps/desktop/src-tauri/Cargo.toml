[package]
name = "rewind-desktop"
version = "0.1.0"
edition = "2021"
description = "REWIND desktop daemon (codename). Local-first context memory."
authors = ["REWIND"]
license = "UNLICENSED"
publish = false
rust-version = "1.77"

# Windows version-info resource. tauri-winres reads this section, and its absence fails the build
# script on Windows rather than degrading — so it is required, not decorative.
[package.metadata.winres]
ProductName = "REWIND"
FileDescription = "REWIND — une mémoire contextuelle pour ton ordinateur"
LegalCopyright = "REWIND"
OriginalFilename = "rewind-desktop.exe"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled: SQLite is compiled in, so there is no system library to install on either platform.
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Time",
] }

[profile.release]
# The daemon runs all day; size and startup matter more than the last few percent of throughput.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
